<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Springs</title><link rel="stylesheet" href="shared.css"></head><body><main class="wrap"><a href="index.html">Back</a><h1 class="demo-title">Spring motion</h1><p class="lead">The object moves toward a target using stiffness, damping and mass rather than a fixed duration.</p><div class="controls"><button data-left>Left</button><button data-center class="primary">Center</button><button data-right>Right</button><button data-kick>Impulse</button></div><section class="stage spring-target"><div class="orb" data-ball></div></section><pre class="code">const motion = new SpringMotion(ball, {
  x: { stiffness: 210, damping: 18, mass: 1 }
});
motion.to({ x: 220 });
motion.impulse({ y: -180, rotate: 300 });</pre></main><script type="module">import{SpringMotion}from"../src/index.js";const ball=document.querySelector('[data-ball]');const m=new SpringMotion(ball,{x:{stiffness:210,damping:18},y:{stiffness:180,damping:16},rotate:{stiffness:130,damping:14}});document.querySelector('[data-left]').onclick=()=>m.to({x:-220});document.querySelector('[data-center]').onclick=()=>m.to({x:0});document.querySelector('[data-right]').onclick=()=>m.to({x:220});document.querySelector('[data-kick]').onclick=()=>m.impulse({y:-280,rotate:420});</script></body></html>
